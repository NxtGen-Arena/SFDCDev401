<template>
    <lightning-card title="Imperative CRUD Actions" icon-name="standard:record">
        <div class="slds-p-around_medium slds-grid slds-gutters">
            <div class="slds-col">
                <lightning-button
                    variant="brand"
                    label="Update Phone (imperative)"
                    onclick={handleUpdate}>
                </lightning-button>
            </div>
            <div class="slds-col">
                <lightning-button
                    variant="destructive"
                    label="Delete Contact"
                    onclick={handleDelete}>
                </lightning-button>
            </div>
            <div class="slds-col">
                <lightning-button
                    variant="neutral"
                    label="Notify Change (force refresh)"
                    onclick={handleNotifyChange}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
