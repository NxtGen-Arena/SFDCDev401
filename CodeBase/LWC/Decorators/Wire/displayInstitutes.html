<template>
    <lightning-card title="Training Institute Directory" icon-name="standard:account">

        <!-- Wire with Parameter -->
        <div class="slds-p-around_medium">
            <lightning-combobox
                label="Select Industry"
                value={selectedIndustry}
                options={IndustryOptions}
                onchange={handleIndustryChange}>
            </lightning-combobox>
        </div>

        <!-- All Institutes -->
        <div class="slds-p-around_medium">
            <h3 class="slds-text-heading_small">All Institutes</h3>

            <template if:true={institutes.data}>
                <template for:each={institutes.data} for:item="inst">
                    <p key={inst.Id}>
                        {inst.Name} - {inst.BillingCity}
                    </p>
                </template>
            </template>

            <template if:true={institutes.error}>
                <p>Error loading institutes.</p>
            </template>
        </div>

        <hr/>

        <!-- Filtered Institutes -->
        <div class="slds-p-around_medium">
            <h3 class="slds-text-heading_small">
                Institutes in {selectedIndustry}
            </h3>

            <template if:true={filteredInstitutes.data}>
                <template for:each={filteredInstitutes.data} for:item="inst">
                    <p key={inst.Id}>
                        {inst.Name} - {inst.BillingCity}
                    </p>
                </template>
            </template>

            <template if:true={filteredInstitutes.error}>
                <p>No institutes found.</p>
            </template>
        </div>

    </lightning-card>
</template>
